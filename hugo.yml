baseURL: 'https://juniperspring.org'
languageCode: 'en-us'
title: 'Juniperspring'
theme: 'github.com/adityatelange/hugo-PaperMod'

pagination:
    pagerSize: 10000

module:
    - module.imports:
        path: 'github.com/divinerites/plausible-hugo'
    - module.imports:
        path: 'github.com/adityatelange/hugo-PaperMod'

params.plausible:
    enable: true
    domain: 'juniperspring.org'
    # cspell:disable-next-line
    gitstar: false

# See: https://github.com/adityatelange/hugo-PaperMod/wiki/Variables#site-variables-under-params
params:
    author: "Eric McDonald" # Appears in meta name="author" tag
    description: "Personal Blog of Eric McDonald" # Appears in meta name="description" tag
    ShowToc: true
    ShowPostNavLinks: true
    ShowCodeCopyButtons: true
    ShowShareButtons: true
    hideSummary: true
    defaultTheme: dark
    label:
        text: Juniperspring🌱
    homeInfoParams:
        Title: Eric McDonald
        Content: Personal Blog of Eric McDonald
    socialIcons:
        - name: "GitHub"
          url: "https://github.com/librick/"
        - name: "ENS"
          url: "https://app.ens.domains/juniperspring.eth"
        - name: "RSS"
          url: "https://juniperspring.org/index.xml"
